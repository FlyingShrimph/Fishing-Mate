name: Update Busan tide data
on:
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-tide.mjs
        env:
          TIDE_API_URL: ${{ secrets.TIDE_API_URL }}
          TIDE_API_KEY: ${{ secrets.TIDE_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tide-data.json
          git diff --cached --quiet || git commit -m "Update Busan tide data"
          git push
