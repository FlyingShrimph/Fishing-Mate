name: Update tide data from Fishbisu
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/update-tide-fishbisu.mjs
      - name: Commit updated tide data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tide-data.json
          git diff --cached --quiet || git commit -m "Update tide data from Fishbisu"
          git push
